[project]
name = "latch-relay-sdk"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
